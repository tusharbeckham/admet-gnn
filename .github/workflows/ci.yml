  #     - run: pnpm install --frozen-lockfile
  #     - run: pnpm run check          # svelte-check: types AND unused a11y props
  #     - run: pnpm run lint
  #     - run: pnpm run test:unit
  #     - run: pnpm run build          # a type error that only appears in a
  #                                    # production build is still a type error

